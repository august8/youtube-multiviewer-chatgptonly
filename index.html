<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.twitch.tv https://www.twitch.tv;"
    />
    <title>Youtubeの動画を同時に見るやつ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        background-color: #121212;
        color: #f0f0f0;
      }
      .video-container {
        display: grid;
        justify-content: center;
        align-content: center;
        width: 100vw;
        height: 100vh;
        gap: 10px;
        padding: 10px;
      }
      .video-item {
        display: flex;
        gap: 10px;
        background: #1a1a1a;
        border-radius: 8px;
        overflow: hidden;
        min-width: 0;
      }
      .video-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .video-wrapper {
        position: relative;
        background: #000;
        flex: 1;
        min-width: 0;
      }
      .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .video-controls {
        background: #2a2a2a;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .control-row {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: space-between;
      }
      .seek-buttons {
        display: flex;
        gap: 3px;
      }
      .time-display {
        font-size: 12px;
        color: #aaa;
        min-width: 60px;
        text-align: center;
      }
      .chat-wrapper {
        position: relative;
        background: #1a1a1a;
        width: 340px;
        min-width: 280px;
        display: none;
      }
      .chat-wrapper.visible {
        display: block;
      }
      .chat-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .controls-overlay {
        position: absolute;
        top: 5px;
        right: 5px;
        display: flex;
        gap: 5px;
        z-index: 10;
      }
      .control-button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
        backdrop-filter: blur(4px);
      }
      .control-button:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      .control-button.delete {
        background: rgba(220, 53, 69, 0.8);
      }
      .control-button.delete:hover {
        background: rgba(220, 53, 69, 1);
      }
      .control-button.chat {
        background: rgba(0, 123, 255, 0.8);
      }
      .control-button.chat:hover {
        background: rgba(0, 123, 255, 1);
      }
      .control-button.chat.active {
        background: rgba(40, 167, 69, 0.8);
      }
      .control-button.mute {
        background: rgba(108, 117, 125, 0.8);
      }
      .control-button.mute:hover {
        background: rgba(108, 117, 125, 1);
      }
      .seek-button {
        background: rgba(0, 123, 255, 0.7);
        color: white;
        border: none;
        border-radius: 3px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 11px;
        min-width: 45px;
      }
      .seek-button:hover {
        background: rgba(0, 123, 255, 0.9);
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal.visible {
        display: flex;
      }
      .modal-content {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal-content input[type="text"] {
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        width: 100%;
        margin-bottom: 10px;
      }
      .modal-content .checkbox-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .modal-content .checkbox-container input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .sync-section {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      .sync-section h3 {
        font-size: 14px;
        margin-bottom: 10px;
        color: #4a9eff;
      }
      .sync-input-group {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .sync-input-group input {
        padding: 8px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        width: 100px;
      }
      .sync-input-group button {
        padding: 8px 12px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #28a745;
        color: #fff;
        cursor: pointer;
      }
      .sync-input-group button:hover {
        background: #218838;
      }
      .modal-content .button-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }
      .modal-content button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: #fff;
        cursor: pointer;
        min-width: 48%;
      }
      .modal-content button:hover {
        background: #0056b3;
      }
      .modal-content .reset {
        background: #dc3545;
      }
      .modal-content .reset:hover {
        background: #a71d2a;
      }
      .modal-content .close-modal {
        background: #6c757d;
      }
      .modal-content .close-modal:hover {
        background: #5a6268;
      }
      .toggle-modal {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        font-size: 16px;
        border: none;
        border-radius: 50%;
        background: #007bff;
        color: #fff;
        cursor: pointer;
        z-index: 1000;
        width: 50px;
        height: 50px;
      }
      .toggle-modal:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="video-container" id="videoContainer"></div>
    <div class="modal" id="controlsModal">
      <div class="modal-content">
        <input
          type="text"
          id="videoUrl"
          placeholder="YouTube または Twitch の URL を入力"
        />
        <div class="checkbox-container" id="liveCheckContainer">
          <input type="checkbox" id="isLiveStream" checked />
          <label for="isLiveStream">ライブ配信（チャット機能を有効化）</label>
        </div>

        <div class="button-container">
          <button id="addVideo">追加</button>
          <button id="resetVideos" class="reset">リセット</button>
        </div>
        <button class="close-modal" id="closeModal">閉じる</button>
        <div
          style="
            text-align: center;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
            font-size: 12px;
            color: #888;
          "
        >
          v1.2.0
        </div>
      </div>
    </div>
    <button class="toggle-modal" id="toggleModal">☰</button>

    <script>
      const videoContainer = document.getElementById("videoContainer");
      const videoUrlInput = document.getElementById("videoUrl");
      const controlsModal = document.getElementById("controlsModal");
      const toggleModalButton = document.getElementById("toggleModal");
      const closeModalButton = document.getElementById("closeModal");
      const isLiveStream = document.getElementById("isLiveStream");
      const liveCheckContainer = document.getElementById("liveCheckContainer");

      let players = {};
      let playerReady = {};
      let ytApiReady = false;

      // ブラウザのダークモード設定を検出
      function isDarkMode() {
        return (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        );
      }

      // プラットフォーム切り替え時の処理
      document.querySelectorAll('input[name="platform"]').forEach((radio) => {
        radio.addEventListener("change", (e) => {
          const platform = e.target.value;
          const urlInput = document.getElementById("videoUrl");

          if (platform === "youtube") {
            urlInput.placeholder = "YouTube動画のURLを入力";
            liveCheckContainer.style.display = "flex";
          } else if (platform === "twitch") {
            urlInput.placeholder =
              "TwitchチャンネルのURLを入力 (例: twitch.tv/channelname)";
            liveCheckContainer.style.display = "none";
            isLiveStream.checked = true; // Twitchは常にライブ
          }
        });
      });

      // YouTube IFrame APIの読み込み
      function loadYouTubeAPI() {
        const tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName("script")[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
      }

      // APIが読み込まれたときのコールバック
      window.onYouTubeIframeAPIReady = function () {
        console.log("YouTube IFrame API Ready");
        ytApiReady = true;
      };

      function extractVideoId(url) {
        const patterns = [
          /(?:youtube\.com\/watch\?v=)([^&\s]+)/,
          /(?:youtu\.be\/)([^&\s?]+)/,
          /(?:youtube\.com\/live\/)([^&\s?]+)/,
          /(?:youtube\.com\/embed\/)([^&\s?]+)/,
        ];

        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match) return match[1];
        }
        return null;
      }

      function extractTwitchChannel(url) {
        // twitch.tv/channelname のパターンを抽出
        const patterns = [
          /(?:twitch\.tv\/)([^\/\s?]+)/,
          /(?:www\.twitch\.tv\/)([^\/\s?]+)/,
        ];

        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match) return match[1];
        }

        // URLでない場合、そのままチャンネル名として返す
        return url.trim();
      }

      function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) {
          return `${h}:${m.toString().padStart(2, "0")}:${s
            .toString()
            .padStart(2, "0")}`;
        }
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      function parseTime(timeStr) {
        const parts = timeStr.split(":").map((p) => parseInt(p, 10));
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        return 0;
      }

      function updateTimeDisplay(videoId) {
        const player = players[videoId];
        if (player && playerReady[videoId]) {
          try {
            const currentTime = player.getCurrentTime();
            const timeDisplay = document.querySelector(
              `[data-video-id="${videoId}"] .time-display`
            );
            if (timeDisplay) {
              timeDisplay.textContent = formatTime(currentTime);
            }
          } catch (e) {
            // Player not ready yet
          }
        }
      }

      function adjustVideoGrid() {
        const videoCount = videoContainer.children.length;
        if (videoCount === 0) return;

        let cols = videoCount === 1 ? 1 : Math.ceil(Math.sqrt(videoCount));
        let rows = Math.ceil(videoCount / cols);

        videoContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        videoContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      }

      function createVideoItem(videoId, platform = "youtube", isLive = true) {
        console.log(
          "Creating video item for:",
          videoId,
          "isLive:",
          isLive,
          "platform:",
          platform
        );

        const videoItem = document.createElement("div");
        videoItem.className = "video-item";
        videoItem.dataset.videoId = videoId;
        videoItem.dataset.platform = platform;

        const videoSection = document.createElement("div");
        videoSection.className = "video-section";

        const videoWrapper = document.createElement("div");
        videoWrapper.className = "video-wrapper";

        let playerDiv;

        if (platform === "twitch") {
          // Twitch用のiframe
          playerDiv = document.createElement("iframe");
          playerDiv.id = `player-${videoId}`;
          const domain = window.location.hostname || "localhost";
          playerDiv.src = `https://player.twitch.tv/?channel=${videoId}&parent=${domain}`;
          playerDiv.allowFullscreen = true;
          playerDiv.style.width = "100%";
          playerDiv.style.height = "100%";
        } else {
          // YouTube用のdiv（後でYT.Playerで初期化）
          playerDiv = document.createElement("div");
          playerDiv.id = `player-${videoId}`;
        }

        const controlsOverlay = document.createElement("div");
        controlsOverlay.className = "controls-overlay";

        const muteButton = document.createElement("button");
        muteButton.className = "control-button mute";
        muteButton.textContent = "🔊";

        if (platform === "youtube") {
          muteButton.addEventListener("click", () => {
            const player = players[videoId];
            if (player && playerReady[videoId]) {
              const isMuted = player.isMuted();
              if (isMuted) {
                player.unMute();
                muteButton.textContent = "🔊";
              } else {
                player.mute();
                muteButton.textContent = "🔇";
              }
            }
          });
        } else {
          // Twitchの場合はiframe経由で制御できないので無効化
          muteButton.style.opacity = "0.3";
          muteButton.style.cursor = "not-allowed";
          muteButton.title = "Twitchプレイヤーで直接操作してください";
        }

        const chatButton = document.createElement("button");
        chatButton.className = "control-button chat";
        chatButton.textContent = "💬";
        chatButton.title = "チャットを開く";

        // ライブ配信の場合のみチャット機能を有効化
        if (isLive) {
          chatButton.addEventListener("click", () => {
            const chatWrapper = videoItem.querySelector(".chat-wrapper");
            chatWrapper.classList.toggle("visible");
            chatButton.classList.toggle("active");
          });

          if (platform === "youtube") {
            chatButton.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              const darkMode = isDarkMode() ? 1 : 0;
              const chatUrl = `https://www.youtube.com/live_chat?is_popout=1&v=${videoId}&dark_theme=${darkMode}`;
              window.open(
                chatUrl,
                `chat_${videoId}`,
                "width=400,height=600,scrollbars=yes"
              );
            });
          }
        } else {
          // アーカイブの場合は無効化
          chatButton.style.opacity = "0.3";
          chatButton.style.cursor = "not-allowed";
          chatButton.title = "アーカイブ動画ではチャット機能は利用できません";
          chatButton.addEventListener("click", (e) => {
            e.preventDefault();
            alert(
              "アーカイブ動画ではチャットリプレイは利用できません。\nライブ配信中の動画のみチャット機能が有効です。"
            );
          });
        }

        const deleteButton = document.createElement("button");
        deleteButton.className = "control-button delete";
        deleteButton.textContent = "✕";
        deleteButton.addEventListener("click", () => {
          if (players[videoId]) {
            players[videoId].destroy();
            delete players[videoId];
            delete playerReady[videoId];
          }
          videoItem.remove();
          adjustVideoGrid();
        });

        controlsOverlay.appendChild(muteButton);
        controlsOverlay.appendChild(chatButton);
        controlsOverlay.appendChild(deleteButton);

        videoWrapper.appendChild(playerDiv);
        videoWrapper.appendChild(controlsOverlay);

        // Video controls（YouTubeの場合のみ表示）
        if (platform === "youtube") {
          const videoControls = document.createElement("div");
          videoControls.className = "video-controls";

          const controlRow1 = document.createElement("div");
          controlRow1.className = "control-row";

          const seekButtons = document.createElement("div");
          seekButtons.className = "seek-buttons";

          const seek10Back = document.createElement("button");
          seek10Back.className = "seek-button";
          seek10Back.textContent = "⏮️ -10s";
          seek10Back.addEventListener("click", () => seekVideo(videoId, -10));

          const seek5Back = document.createElement("button");
          seek5Back.className = "seek-button";
          seek5Back.textContent = "⏪ -5s";
          seek5Back.addEventListener("click", () => seekVideo(videoId, -5));

          const seek5Forward = document.createElement("button");
          seek5Forward.className = "seek-button";
          seek5Forward.textContent = "⏩ +5s";
          seek5Forward.addEventListener("click", () => seekVideo(videoId, 5));

          const seek10Forward = document.createElement("button");
          seek10Forward.className = "seek-button";
          seek10Forward.textContent = "⏭️ +10s";
          seek10Forward.addEventListener("click", () => seekVideo(videoId, 10));

          seekButtons.appendChild(seek10Back);
          seekButtons.appendChild(seek5Back);
          seekButtons.appendChild(seek5Forward);
          seekButtons.appendChild(seek10Forward);

          const timeDisplay = document.createElement("div");
          timeDisplay.className = "time-display";
          timeDisplay.textContent = "0:00";

          controlRow1.appendChild(seekButtons);
          controlRow1.appendChild(timeDisplay);

          videoControls.appendChild(controlRow1);

          videoSection.appendChild(videoWrapper);
          videoSection.appendChild(videoControls);
        } else {
          // Twitchの場合はコントロールなし
          videoSection.appendChild(videoWrapper);
        }

        // チャットラッパーはライブ配信の場合のみ作成（初期状態は非表示）
        let chatWrapper = null;
        if (isLive) {
          chatWrapper = document.createElement("div");
          chatWrapper.className = "chat-wrapper"; // 初期状態では visible クラスなし

          const chatIframe = document.createElement("iframe");
          const domain = window.location.hostname || "localhost";
          const darkMode = isDarkMode() ? 1 : 0;

          if (platform === "twitch") {
            // Twitchチャット（darkpopoutパラメータでダークモード）
            const twitchDark = darkMode ? "&darkpopout" : "";
            chatIframe.src = `https://www.twitch.tv/embed/${videoId}/chat?parent=${domain}${twitchDark}`;
          } else {
            // YouTubeチャット（dark_themeパラメータでダークモード）
            chatIframe.src = `https://www.youtube.com/live_chat?is_popout=1&v=${videoId}&embed_domain=${domain}&dark_theme=${darkMode}`;
          }

          chatIframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";

          chatWrapper.appendChild(chatIframe);
        }

        videoItem.appendChild(videoSection);
        if (chatWrapper) {
          videoItem.appendChild(chatWrapper);
        }

        return videoItem;
      }

      function initializePlayer(videoId) {
        if (!ytApiReady) {
          console.log("YouTube API not ready yet, waiting...");
          setTimeout(() => initializePlayer(videoId), 200);
          return;
        }

        console.log(`Initializing player for ${videoId}`);
        playerReady[videoId] = false;

        try {
          players[videoId] = new YT.Player(`player-${videoId}`, {
            height: "100%",
            width: "100%",
            videoId: videoId,
            playerVars: {
              enablejsapi: 1,
              origin: window.location.origin,
              autoplay: 0,
            },
            events: {
              onReady: (event) => {
                playerReady[videoId] = true;
                console.log(`Player ${videoId} is ready`);
                setInterval(() => updateTimeDisplay(videoId), 1000);
              },
              onStateChange: (event) => {
                console.log(`Player ${videoId} state changed:`, event.data);
              },
              onError: (event) => {
                console.error(`Player ${videoId} error:`, event.data);
                alert(
                  `動画の読み込みエラー (Code: ${event.data})\n100: 動画が見つかりません\n101/150: 埋め込みが許可されていません`
                );
              },
            },
          });
        } catch (error) {
          console.error(`Failed to initialize player ${videoId}:`, error);
        }
      }

      function seekVideo(videoId, seconds) {
        const player = players[videoId];
        if (player && playerReady[videoId]) {
          const currentTime = player.getCurrentTime();
          const newTime = Math.max(0, currentTime + seconds);
          player.seekTo(newTime, true);
          console.log(`Seeking ${videoId} to ${newTime}s`);
        } else {
          console.log(`Player ${videoId} not ready for seeking`);
        }
      }

      document.getElementById("addVideo").addEventListener("click", () => {
        const urlInput = videoUrlInput.value.trim();
        const platform = detectPlatform(urlInput);

        if (!platform) {
          alert("YouTube または Twitch の URL を入力してください。");
          return;
        }

        let videoId;
        if (platform === "youtube") {
          videoId = extractVideoId(urlInput);
        } else if (platform === "twitch") {
          videoId = extractTwitchChannel(urlInput);
        }

        if (videoId) {
          const isLive = platform === "twitch" ? true : isLiveStream.checked;
          const videoItem = createVideoItem(videoId, platform, isLive);
          videoContainer.appendChild(videoItem);
          adjustVideoGrid();

          // YouTubeの場合のみプレイヤーを初期化
          if (platform === "youtube") {
            setTimeout(() => initializePlayer(videoId), 100);
          }

          videoUrlInput.value = "";
        } else {
          alert(
            `正しい${
              platform === "youtube" ? "YouTube" : "Twitch"
            }のURLを入力してください。`
          );
        }
      });

      document.getElementById("resetVideos").addEventListener("click", () => {
        Object.values(players).forEach((player) => {
          if (player) player.destroy();
        });
        players = {};
        playerReady = {};
        videoContainer.innerHTML = "";
        adjustVideoGrid();
      });

      toggleModalButton.addEventListener("click", () => {
        controlsModal.classList.toggle("visible");
      });

      closeModalButton.addEventListener("click", () => {
        controlsModal.classList.remove("visible");
      });

      controlsModal.addEventListener("click", (event) => {
        if (event.target === controlsModal) {
          controlsModal.classList.remove("visible");
        }
      });

      videoUrlInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
          document.getElementById("addVideo").click();
        }
      });

      // Twitchの場合はライブ配信チェックボックスを非表示にする
      videoUrlInput.addEventListener("input", (event) => {
        const url = event.target.value.trim();
        const platform = detectPlatform(url);

        if (platform === "twitch") {
          liveCheckContainer.style.display = "none";
          isLiveStream.checked = true;
        } else if (platform === "youtube") {
          liveCheckContainer.style.display = "flex";
        }
      });

      window.addEventListener("resize", adjustVideoGrid);

      // YouTube API読み込み開始
      loadYouTubeAPI();
    </script>
  </body>
</html>
