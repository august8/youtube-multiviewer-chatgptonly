<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="frame-src https://www.youtube.com https://www.youtube-nocookie.com;"
    />
    <title>Youtubeの動画を同時に見るやつ</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        background-color: #121212;
        color: #f0f0f0;
      }
      .video-container {
        display: grid;
        justify-content: center;
        align-content: center;
        width: 100vw;
        height: 100vh;
        gap: 10px;
        padding: 10px;
      }
      .video-item {
        display: flex;
        gap: 10px;
        background: #1a1a1a;
        border-radius: 8px;
        overflow: hidden;
        min-width: 0;
      }
      .video-section {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-width: 0;
      }
      .video-wrapper {
        position: relative;
        background: #000;
        flex: 1;
        min-width: 0;
      }
      .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .video-controls {
        background: #2a2a2a;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .control-row {
        display: flex;
        gap: 5px;
        align-items: center;
        justify-content: space-between;
      }
      .seek-buttons {
        display: flex;
        gap: 3px;
      }
      .time-display {
        font-size: 12px;
        color: #aaa;
        min-width: 60px;
        text-align: center;
      }
      .chat-wrapper {
        position: relative;
        background: #1a1a1a;
        width: 340px;
        min-width: 280px;
        display: none;
      }
      .chat-wrapper.visible {
        display: block;
      }
      .chat-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
      }
      .controls-overlay {
        position: absolute;
        top: 5px;
        right: 5px;
        display: flex;
        gap: 5px;
        z-index: 10;
      }
      .control-button {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
        backdrop-filter: blur(4px);
      }
      .control-button:hover {
        background: rgba(0, 0, 0, 0.9);
      }
      .control-button.delete {
        background: rgba(220, 53, 69, 0.8);
      }
      .control-button.delete:hover {
        background: rgba(220, 53, 69, 1);
      }
      .control-button.chat {
        background: rgba(0, 123, 255, 0.8);
      }
      .control-button.chat:hover {
        background: rgba(0, 123, 255, 1);
      }
      .control-button.chat.active {
        background: rgba(40, 167, 69, 0.8);
      }
      .control-button.mute {
        background: rgba(108, 117, 125, 0.8);
      }
      .control-button.mute:hover {
        background: rgba(108, 117, 125, 1);
      }
      .seek-button {
        background: rgba(0, 123, 255, 0.7);
        color: white;
        border: none;
        border-radius: 3px;
        padding: 4px 8px;
        cursor: pointer;
        font-size: 11px;
        min-width: 45px;
      }
      .seek-button:hover {
        background: rgba(0, 123, 255, 0.9);
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.8);
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .modal.visible {
        display: flex;
      }
      .modal-content {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal-content input[type="text"] {
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        width: 100%;
        margin-bottom: 10px;
      }
      .modal-content .checkbox-container {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .modal-content .checkbox-container input[type="checkbox"] {
        width: auto;
        margin: 0;
      }
      .sync-section {
        background: #2a2a2a;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 10px;
      }
      .sync-section h3 {
        font-size: 14px;
        margin-bottom: 10px;
        color: #4a9eff;
      }
      .sync-input-group {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .sync-input-group input {
        padding: 8px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        width: 100px;
      }
      .sync-input-group button {
        padding: 8px 12px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #28a745;
        color: #fff;
        cursor: pointer;
      }
      .sync-input-group button:hover {
        background: #218838;
      }
      .modal-content .button-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: space-between;
      }
      .modal-content button {
        flex: 1;
        padding: 10px;
        font-size: 14px;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: #fff;
        cursor: pointer;
        min-width: 48%;
      }
      .modal-content button:hover {
        background: #0056b3;
      }
      .modal-content .reset {
        background: #dc3545;
      }
      .modal-content .reset:hover {
        background: #a71d2a;
      }
      .modal-content .close-modal {
        background: #6c757d;
      }
      .modal-content .close-modal:hover {
        background: #5a6268;
      }
      .toggle-modal {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 10px 15px;
        font-size: 16px;
        border: none;
        border-radius: 50%;
        background: #007bff;
        color: #fff;
        cursor: pointer;
        z-index: 1000;
        width: 50px;
        height: 50px;
      }
      .toggle-modal:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="video-container" id="videoContainer"></div>
    <div class="modal" id="controlsModal">
      <div class="modal-content">
        <input type="text" id="videoUrl" placeholder="YouTube動画のURLを入力" />
        <div class="checkbox-container">
          <input type="checkbox" id="showChatOnAdd" />
          <label for="showChatOnAdd">追加時にチャットも表示</label>
        </div>

        <div class="sync-section">
          <h3>⏱️ 一斉シーク</h3>
          <div class="sync-input-group">
            <input type="text" id="syncTime" placeholder="例: 15:30" />
            <button id="syncAllBtn">全動画を移動</button>
          </div>
          <p style="font-size: 12px; color: #aaa">
            形式: MM:SS または HH:MM:SS
          </p>
        </div>

        <div class="button-container">
          <button id="addVideo">追加</button>
          <button id="resetVideos" class="reset">リセット</button>
          <button id="playAll">すべて再生</button>
          <button id="pauseAll">すべて一時停止</button>
          <button id="toggleAllChat">全チャット切替</button>
        </div>
        <button class="close-modal" id="closeModal">閉じる</button>
      </div>
    </div>
    <button class="toggle-modal" id="toggleModal">☰</button>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      const videoContainer = document.getElementById("videoContainer");
      const videoUrlInput = document.getElementById("videoUrl");
      const controlsModal = document.getElementById("controlsModal");
      const toggleModalButton = document.getElementById("toggleModal");
      const closeModalButton = document.getElementById("closeModal");
      const showChatOnAdd = document.getElementById("showChatOnAdd");

      let players = {};
      let playerReady = {};

      function onYouTubeIframeAPIReady() {
        console.log("YouTube IFrame API Ready");
      }

      function extractVideoId(url) {
        const patterns = [
          /(?:youtube\.com\/watch\?v=)([^&\s]+)/,
          /(?:youtu\.be\/)([^&\s?]+)/,
          /(?:youtube\.com\/live\/)([^&\s?]+)/,
          /(?:youtube\.com\/embed\/)([^&\s?]+)/,
        ];

        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match) return match[1];
        }
        return null;
      }

      function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) {
          return `${h}:${m.toString().padStart(2, "0")}:${s
            .toString()
            .padStart(2, "0")}`;
        }
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      function parseTime(timeStr) {
        const parts = timeStr.split(":").map((p) => parseInt(p, 10));
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        return 0;
      }

      function updateTimeDisplay(videoId) {
        const player = players[videoId];
        if (player && playerReady[videoId]) {
          try {
            const currentTime = player.getCurrentTime();
            const timeDisplay = document.querySelector(
              `[data-video-id="${videoId}"] .time-display`
            );
            if (timeDisplay) {
              timeDisplay.textContent = formatTime(currentTime);
            }
          } catch (e) {
            // Player not ready yet
          }
        }
      }

      function adjustVideoGrid() {
        const videoCount = videoContainer.children.length;
        if (videoCount === 0) return;

        const containerWidth = window.innerWidth - 20;
        const containerHeight = window.innerHeight - 20;

        let cols = videoCount === 1 ? 1 : Math.ceil(Math.sqrt(videoCount));
        let rows = Math.ceil(videoCount / cols);

        videoContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        videoContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      }

      function createVideoItem(videoId, showChat = false) {
        console.log("Video ID:", videoId);

        const videoItem = document.createElement("div");
        videoItem.className = "video-item";
        videoItem.dataset.videoId = videoId;

        const videoSection = document.createElement("div");
        videoSection.className = "video-section";

        const videoWrapper = document.createElement("div");
        videoWrapper.className = "video-wrapper";

        const videoDiv = document.createElement("div");
        videoDiv.id = `player-${videoId}`;
        videoDiv.style.width = "100%";
        videoDiv.style.height = "100%";

        const controlsOverlay = document.createElement("div");
        controlsOverlay.className = "controls-overlay";

        const muteButton = document.createElement("button");
        muteButton.className = "control-button mute";
        muteButton.textContent = "🔊";
        muteButton.dataset.muted = "false";
        muteButton.addEventListener("click", () => {
          const player = players[videoId];
          if (player && playerReady[videoId]) {
            const isMuted = player.isMuted();
            if (isMuted) {
              player.unMute();
              muteButton.textContent = "🔊";
            } else {
              player.mute();
              muteButton.textContent = "🔇";
            }
          }
        });

        const chatButton = document.createElement("button");
        chatButton.className = "control-button chat";
        chatButton.textContent = "💬";
        chatButton.title = "チャットを開く";
        chatButton.addEventListener("click", () => {
          const chatWrapper = videoItem.querySelector(".chat-wrapper");
          const wasVisible = chatWrapper.classList.contains("visible");

          if (!wasVisible) {
            chatWrapper.classList.add("visible");
            chatButton.classList.add("active");
          } else {
            chatWrapper.classList.remove("visible");
            chatButton.classList.remove("active");
          }
        });

        chatButton.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          const chatUrl = `https://www.youtube.com/live_chat?is_popout=1&v=${videoId}`;
          window.open(
            chatUrl,
            `chat_${videoId}`,
            "width=400,height=600,scrollbars=yes"
          );
        });

        const deleteButton = document.createElement("button");
        deleteButton.className = "control-button delete";
        deleteButton.textContent = "✕";
        deleteButton.addEventListener("click", () => {
          if (players[videoId]) {
            players[videoId].destroy();
            delete players[videoId];
            delete playerReady[videoId];
          }
          videoItem.remove();
          adjustVideoGrid();
        });

        controlsOverlay.appendChild(muteButton);
        controlsOverlay.appendChild(chatButton);
        controlsOverlay.appendChild(deleteButton);

        videoWrapper.appendChild(videoDiv);
        videoWrapper.appendChild(controlsOverlay);

        // Video controls
        const videoControls = document.createElement("div");
        videoControls.className = "video-controls";

        const controlRow1 = document.createElement("div");
        controlRow1.className = "control-row";

        const seekButtons = document.createElement("div");
        seekButtons.className = "seek-buttons";

        const seek10Back = document.createElement("button");
        seek10Back.className = "seek-button";
        seek10Back.textContent = "⏮️ -10s";
        seek10Back.addEventListener("click", () => {
          const player = players[videoId];
          if (player && playerReady[videoId]) {
            const currentTime = player.getCurrentTime();
            player.seekTo(Math.max(0, currentTime - 10), true);
          }
        });

        const seek5Back = document.createElement("button");
        seek5Back.className = "seek-button";
        seek5Back.textContent = "⏪ -5s";
        seek5Back.addEventListener("click", () => {
          const player = players[videoId];
          if (player && playerReady[videoId]) {
            const currentTime = player.getCurrentTime();
            player.seekTo(Math.max(0, currentTime - 5), true);
          }
        });

        const seek5Forward = document.createElement("button");
        seek5Forward.className = "seek-button";
        seek5Forward.textContent = "⏩ +5s";
        seek5Forward.addEventListener("click", () => {
          const player = players[videoId];
          if (player && playerReady[videoId]) {
            const currentTime = player.getCurrentTime();
            player.seekTo(currentTime + 5, true);
          }
        });

        const seek10Forward = document.createElement("button");
        seek10Forward.className = "seek-button";
        seek10Forward.textContent = "⏭️ +10s";
        seek10Forward.addEventListener("click", () => {
          const player = players[videoId];
          if (player && playerReady[videoId]) {
            const currentTime = player.getCurrentTime();
            player.seekTo(currentTime + 10, true);
          }
        });

        seekButtons.appendChild(seek10Back);
        seekButtons.appendChild(seek5Back);
        seekButtons.appendChild(seek5Forward);
        seekButtons.appendChild(seek10Forward);

        const timeDisplay = document.createElement("div");
        timeDisplay.className = "time-display";
        timeDisplay.textContent = "0:00";

        controlRow1.appendChild(seekButtons);
        controlRow1.appendChild(timeDisplay);

        videoControls.appendChild(controlRow1);

        videoSection.appendChild(videoWrapper);
        videoSection.appendChild(videoControls);

        const chatWrapper = document.createElement("div");
        chatWrapper.className = `chat-wrapper${showChat ? " visible" : ""}`;

        const chatIframe = document.createElement("iframe");
        const domain = window.location.hostname;
        // アーカイブのチャットリプレイにも対応
        chatIframe.src = `https://www.youtube.com/live_chat?is_popout=1&v=${videoId}&embed_domain=${domain}`;
        chatIframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        chatIframe.dataset.videoId = videoId;

        chatWrapper.appendChild(chatIframe);

        // 動画の再生位置が変わったときにチャットを同期（試験的）
        // Note: チャットリプレイは自動的に動画と同期するはずですが、
        // 一部の動画では手動でリロードが必要な場合があります

        videoItem.appendChild(videoSection);
        videoItem.appendChild(chatWrapper);

        if (showChat) {
          chatButton.classList.add("active");
        }

        // Initialize YouTube Player
        playerReady[videoId] = false;

        // YouTube APIが読み込まれているか確認
        if (typeof YT === "undefined" || typeof YT.Player === "undefined") {
          console.error("YouTube IFrame API not loaded yet");
          // APIが読み込まれるまで待つ
          const checkAPI = setInterval(() => {
            if (typeof YT !== "undefined" && typeof YT.Player !== "undefined") {
              clearInterval(checkAPI);
              initPlayer(videoId);
            }
          }, 100);
        } else {
          initPlayer(videoId);
        }

        function initPlayer(vid) {
          console.log(`Initializing player for ${vid}`);
          players[vid] = new YT.Player(`player-${vid}`, {
            videoId: vid,
            playerVars: {
              enablejsapi: 1,
              origin: window.location.origin,
              autoplay: 0,
            },
            events: {
              onReady: (event) => {
                playerReady[vid] = true;
                console.log(`Player ${vid} ready - can now be controlled`);

                // Update time display every second
                setInterval(() => updateTimeDisplay(vid), 1000);
              },
              onStateChange: (event) => {
                console.log(`Player ${vid} state:`, event.data);
                // -1: 未開始, 0: 終了, 1: 再生中, 2: 一時停止, 3: バッファリング, 5: 頭出し済み
              },
              onError: (event) => {
                console.error(`Player ${vid} error:`, event.data);
                // 2: 無効なパラメータ, 5: HTML5エラー, 100: 動画が見つからない, 101/150: 埋め込み不可
              },
            },
          });
        }

        return videoItem;
      }

      document.getElementById("addVideo").addEventListener("click", () => {
        const videoId = extractVideoId(videoUrlInput.value.trim());
        if (videoId) {
          const showChat = showChatOnAdd.checked;
          const videoItem = createVideoItem(videoId, showChat);
          videoContainer.appendChild(videoItem);
          adjustVideoGrid();
          videoUrlInput.value = "";
        } else {
          alert("正しいYouTubeのURLを入力してください。");
        }
      });

      document.getElementById("resetVideos").addEventListener("click", () => {
        Object.values(players).forEach((player) => {
          if (player) player.destroy();
        });
        players = {};
        playerReady = {};
        videoContainer.innerHTML = "";
        adjustVideoGrid();
      });

      document.getElementById("playAll").addEventListener("click", () => {
        Object.entries(players).forEach(([videoId, player]) => {
          if (playerReady[videoId]) {
            player.playVideo();
          }
        });
      });

      document.getElementById("pauseAll").addEventListener("click", () => {
        Object.entries(players).forEach(([videoId, player]) => {
          if (playerReady[videoId]) {
            player.pauseVideo();
          }
        });
      });

      document.getElementById("syncAllBtn").addEventListener("click", () => {
        const timeStr = document.getElementById("syncTime").value.trim();
        if (!timeStr) {
          alert("時間を入力してください（例: 15:30）");
          return;
        }

        const targetSeconds = parseTime(timeStr);
        if (targetSeconds === 0 && timeStr !== "0:00") {
          alert("正しい時間形式で入力してください（例: 15:30 または 1:15:30）");
          return;
        }

        Object.entries(players).forEach(([videoId, player]) => {
          if (playerReady[videoId]) {
            player.seekTo(targetSeconds, true);
          }
        });
      });

      document.getElementById("toggleAllChat").addEventListener("click", () => {
        const allChats = document.querySelectorAll(".chat-wrapper");
        const anyVisible = Array.from(allChats).some((chat) =>
          chat.classList.contains("visible")
        );

        allChats.forEach((chat) => {
          if (anyVisible) {
            chat.classList.remove("visible");
          } else {
            chat.classList.add("visible");
          }
        });

        document.querySelectorAll(".control-button.chat").forEach((btn) => {
          if (anyVisible) {
            btn.classList.remove("active");
          } else {
            btn.classList.add("active");
          }
        });
      });

      toggleModalButton.addEventListener("click", () => {
        controlsModal.classList.toggle("visible");
      });

      closeModalButton.addEventListener("click", () => {
        controlsModal.classList.remove("visible");
      });

      controlsModal.addEventListener("click", (event) => {
        if (event.target === controlsModal) {
          controlsModal.classList.remove("visible");
        }
      });

      videoUrlInput.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
          document.getElementById("addVideo").click();
        }
      });

      document
        .getElementById("syncTime")
        .addEventListener("keypress", (event) => {
          if (event.key === "Enter") {
            document.getElementById("syncAllBtn").click();
          }
        });

      window.addEventListener("resize", adjustVideoGrid);
    </script>
  </body>
</html>
